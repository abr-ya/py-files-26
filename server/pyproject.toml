[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py-files-server"
version = "0.1.0"
description = "FastAPI backend for network file upload (MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.0",
  "passlib[bcrypt]>=1.7",
  "bcrypt>=4.1,<5",
  "python-jose[cryptography]>=3.3",
  "python-multipart>=0.0.6",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.26",
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

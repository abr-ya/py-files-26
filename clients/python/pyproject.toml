[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "py-files-cli"
version = "0.1.0"
description = "CLI client for py-files upload/download (MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
]

[project.scripts]
pyfiles = "py_files_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
